name: Publish PostgreSQL Refresh Images

on:
  push:
    branches:
      - main
    paths:
      - release-tracks.json

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Resolve refresh publish
    runs-on: ubuntu-latest

    outputs:
      should_publish: ${{ steps.guard.outputs.should_publish }}
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Guard refresh scope
        id: guard
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BEFORE" "$AFTER")"

          if [[ "$changed" != "release-tracks.json" ]]; then
            {
              echo "PostgreSQL refresh publishing skipped because the push changed files other than release-tracks.json."
              echo
              echo '```text'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve latest project release
        id: release
        if: steps.guard.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq 'map(select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))[0].tagName // empty')"

          if [[ -z "$tag" ]]; then
            echo "No non-draft, non-prerelease project release exists; skipping PostgreSQL refresh publish." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish refreshed PostgreSQL images
    needs: guard
    if: needs.guard.outputs.should_publish == 'true' && needs.guard.outputs.release_tag != ''
    uses: ./.github/workflows/publish-images.yml
    with:
      release_tag: ${{ needs.guard.outputs.release_tag }}
      track_ref: ${{ github.sha }}
      previous_tracks_ref: ${{ github.event.before }}
      tracks: all
      publish_moving_tags: true
      dry_run: false
    permissions:
      contents: read
      packages: write
