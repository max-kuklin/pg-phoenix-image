name: Publish Images

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing project release tag to publish from
        required: true
        type: string
      track_ref:
        description: Ref containing the release-tracks.json manifest to publish
        required: true
        type: string
      previous_tracks_ref:
        description: Optional ref containing the previous release-tracks.json manifest
        required: false
        default: ""
        type: string
      tracks:
        description: Comma-separated PostgreSQL majors, or all
        required: false
        default: all
        type: string
      publish_moving_tags:
        description: Update moving tags after immutable tags are published
        required: false
        default: true
        type: boolean
      dry_run:
        description: Build and test without pushing
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing project release tag to publish from
        required: true
      track_ref:
        description: Ref containing release-tracks.json
        required: true
        default: main
      previous_tracks_ref:
        description: Optional previous ref for changed-track publishing
        required: false
        default: ""
      tracks:
        description: Comma-separated PostgreSQL majors, or all
        required: true
        default: all
      publish_moving_tags:
        description: Update moving tags after immutable tags are published
        required: true
        default: true
        type: boolean
      dry_run:
        description: Build and test without pushing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve publish plan
    runs-on: ubuntu-latest

    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
      images: ${{ steps.plan.outputs.images }}
      upgrade_pairs: ${{ steps.plan.outputs.upgrade_pairs }}
      moving_tags: ${{ steps.plan.outputs.moving_tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.track_ref }}
          fetch-depth: 0

      - name: Resolve project release
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG_INPUT"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Project release tag must match vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          sha="$(git rev-list -n 1 "$tag")"

          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Read previous track manifest
        if: inputs.previous_tracks_ref != ''
        env:
          PREVIOUS_TRACKS_REF: ${{ inputs.previous_tracks_ref }}
        run: |
          set -euo pipefail

          git show "$PREVIOUS_TRACKS_REF:release-tracks.json" > previous-release-tracks.json

      - name: Resolve image matrix
        id: plan
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TRACKS: ${{ inputs.tracks || 'all' }}
          PREVIOUS_TRACKS_REF: ${{ inputs.previous_tracks_ref }}
        run: |
          set -euo pipefail

          args=(
            --tracks-file release-tracks.json
            --release-tag "$RELEASE_TAG"
            --release-sha "$RELEASE_SHA"
            --tracks "$TRACKS"
          )

          if [[ -n "$PREVIOUS_TRACKS_REF" ]]; then
            args+=(--previous-tracks-file previous-release-tracks.json)
          fi

          plan="$(node scripts/resolve-publish-plan.js "${args[@]}")"
          images="$(jq -c '.images' <<< "$plan")"
          upgrade_pairs="$(jq -c '.upgradePairs' <<< "$plan")"
          moving_tags="$(jq -c '[.images[] | {major, minor, immutable: .tags.immutable, moving: .tags.moving}]' <<< "$plan")"

          if [[ "$images" == "[]" ]]; then
            echo "No PostgreSQL tracks selected for publishing." >> "$GITHUB_STEP_SUMMARY"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "upgrade_pairs=$upgrade_pairs" >> "$GITHUB_OUTPUT"
          echo "moving_tags=$moving_tags" >> "$GITHUB_OUTPUT"

  build-test-stage:
    name: Build, test, stage image (${{ matrix.major }})
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.images) }}

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      LOCAL_IMAGE: pg-phoenix-image:publish-${{ matrix.major }}
      STAGING_TAG: ci-${{ needs.plan.outputs.release_tag }}-${{ matrix.major }}-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
      DRY_RUN: ${{ inputs.dry_run || false }}

    steps:
      - name: Check out project release
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.plan.outputs.release_tag }}
          path: harness

      - name: Check out current track manifest
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.track_ref }}
          path: track-source

      - name: Overlay current track manifest
        run: cp track-source/release-tracks.json harness/release-tracks.json

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install dependencies
        working-directory: harness
        run: npm ci

      - name: Pull Bash contract image
        run: docker pull debian:bookworm-slim

      - name: Build image
        working-directory: harness
        run: |
          set -euo pipefail

          docker build \
            --build-arg "PG_BASE=${{ matrix.base }}" \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=$RELEASE_TAG" \
            --build-arg "IMAGE_REVISION=$RELEASE_SHA" \
            --build-arg "PG_TRACK_MAJOR=${{ matrix.major }}" \
            --build-arg "PG_TRACK_MINOR=${{ matrix.minor }}" \
            -t "$LOCAL_IMAGE" \
            .

      - name: Run contract tests
        working-directory: harness
        run: npm run test:contracts

      - name: Run image smoke tests
        working-directory: harness
        env:
          PG_PHOENIX_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: npm run test:image

      - name: Run backup tests
        working-directory: harness
        env:
          PG_PHOENIX_IMAGE: ${{ env.LOCAL_IMAGE }}
          PG_TEST_MAJOR: ${{ matrix.major }}
        run: npm run test:e2e

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push staging tag
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail

          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:$STAGING_TAG"
          docker push "$REGISTRY_IMAGE:$STAGING_TAG"

  upgrade-tests:
    name: Upgrade test (${{ matrix.oldMajor }} -> ${{ matrix.newMajor }})
    needs: plan
    if: needs.plan.outputs.should_publish == 'true' && needs.plan.outputs.upgrade_pairs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.upgrade_pairs) }}

    env:
      NEW_IMAGE: pg-phoenix-image:upgrade-new-${{ matrix.newMajor }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}

    steps:
      - name: Check out project release
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.plan.outputs.release_tag }}
          path: harness

      - name: Check out current track manifest
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.track_ref }}
          path: track-source

      - name: Overlay current track manifest
        run: cp track-source/release-tracks.json harness/release-tracks.json

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install dependencies
        working-directory: harness
        run: npm ci

      - name: Build new major image
        working-directory: harness
        run: |
          set -euo pipefail

          base="$(jq -r --arg major "${{ matrix.newMajor }}" '.tracks[] | select(.major == $major) | .base' release-tracks.json)"
          minor="$(jq -r --arg major "${{ matrix.newMajor }}" '.tracks[] | select(.major == $major) | .minor' release-tracks.json)"

          if [[ -z "$base" || -z "$minor" ]]; then
            echo "No release track found for PostgreSQL ${{ matrix.newMajor }}" >&2
            exit 1
          fi

          docker build \
            --build-arg "PG_BASE=$base" \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=$RELEASE_TAG" \
            --build-arg "IMAGE_REVISION=$RELEASE_SHA" \
            --build-arg "PG_TRACK_MAJOR=${{ matrix.newMajor }}" \
            --build-arg "PG_TRACK_MINOR=$minor" \
            -t "$NEW_IMAGE" \
            .

      - name: Run adjacent upgrade tests
        working-directory: harness
        env:
          PG_TEST_OLD: ${{ matrix.oldMajor }}
          PG_TEST_NEW: ${{ matrix.newMajor }}
          PG_PHOENIX_IMAGE: ${{ env.NEW_IMAGE }}
          PG_PHOENIX_NEW_IMAGE: ${{ env.NEW_IMAGE }}
        run: npm run test:upgrade

  promote-images:
    name: Promote staged images
    needs:
      - plan
      - build-test-stage
      - upgrade-tests
    if: always() && needs.plan.outputs.should_publish == 'true' && needs.build-test-stage.result == 'success' && (needs.upgrade-tests.result == 'success' || needs.upgrade-tests.result == 'skipped') && inputs.dry_run != true
    runs-on: ubuntu-latest

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      IMAGES: ${{ needs.plan.outputs.images }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
      PUBLISH_MOVING_TAGS: ${{ inputs.publish_moving_tags || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote staging tags
        run: |
          set -euo pipefail

          verify_existing_image() {
            local image="$1"
            local expected_base="$2"
            local expected_major="$3"
            local expected_minor="$4"
            local labels

            labels="$(docker buildx imagetools inspect "$image" --format '{{ json .Config.Labels }}')"

            jq -e \
              --arg version "$RELEASE_TAG" \
              --arg revision "$RELEASE_SHA" \
              --arg base "$expected_base" \
              --arg major "$expected_major" \
              --arg minor "$expected_minor" \
              '
                ."org.opencontainers.image.version" == $version and
                ."org.opencontainers.image.revision" == $revision and
                ."org.pg-phoenix.postgres.base" == $base and
                ."org.pg-phoenix.postgres.major" == $major and
                ."org.pg-phoenix.postgres.minor" == $minor
              ' <<< "$labels" >/dev/null
          }

          add_new_immutable_tag() {
            local target="$1"
            local expected_base="$2"
            local expected_major="$3"
            local expected_minor="$4"

            if docker manifest inspect "$REGISTRY_IMAGE:$target" >/dev/null 2>&1; then
              if verify_existing_image "$REGISTRY_IMAGE:$target" "$expected_base" "$expected_major" "$expected_minor"; then
                echo "Tag already exists with matching metadata: $REGISTRY_IMAGE:$target"
                return 0
              fi

              echo "Tag already exists with different metadata: $REGISTRY_IMAGE:$target" >&2
              exit 1
            fi

            public_tags+=(--tag "$REGISTRY_IMAGE:$target")
          }

          jq -c '.[]' <<< "$IMAGES" | while read -r image; do
            major="$(jq -r '.major' <<< "$image")"
            minor="$(jq -r '.minor' <<< "$image")"
            base="$(jq -r '.base' <<< "$image")"
            staging_tag="ci-$RELEASE_TAG-$major-${{ github.run_id }}-${{ github.run_attempt }}"
            source="$REGISTRY_IMAGE:$staging_tag"
            public_tags=()

            mapfile -t immutable_tags < <(jq -r '.tags.immutable[]' <<< "$image")
            for immutable_tag in "${immutable_tags[@]}"; do
              add_new_immutable_tag "$immutable_tag" "$base" "$major" "$minor"
            done

            if [[ "$PUBLISH_MOVING_TAGS" == "true" ]]; then
              mapfile -t moving_tags < <(jq -r '.tags.moving[]' <<< "$image")
              for moving_tag in "${moving_tags[@]}"; do
                public_tags+=(--tag "$REGISTRY_IMAGE:$moving_tag")
              done
            fi

            if [[ "${#public_tags[@]}" -gt 0 ]]; then
              docker buildx imagetools create "${public_tags[@]}" "$source"
            fi
          done

  cleanup-staging:
    name: Cleanup staging tags
    needs:
      - plan
      - build-test-stage
      - upgrade-tests
      - promote-images
    if: always() && needs.plan.outputs.should_publish == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      IMAGES: ${{ needs.plan.outputs.images }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Delete staging package versions
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          package="${GITHUB_REPOSITORY#*/}"

          package_api() {
            local path="$1"

            if gh api -H "Accept: application/vnd.github+json" "/users/$owner/packages/container/$package/$path" >/tmp/package-api.out 2>/tmp/package-api.err; then
              printf '/users/%s/packages/container/%s/%s\n' "$owner" "$package" "$path"
              return 0
            fi

            if gh api -H "Accept: application/vnd.github+json" "/orgs/$owner/packages/container/$package/$path" >/tmp/package-api.out 2>/tmp/package-api.err; then
              printf '/orgs/%s/packages/container/%s/%s\n' "$owner" "$package" "$path"
              return 0
            fi

            cat /tmp/package-api.err >&2
            return 1
          }

          delete_staging_tag() {
            local tag="$1"
            local versions_path
            local version_id

            versions_path="$(package_api versions)"
            version_id="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "$versions_path" \
                --paginate \
                --jq ".[] | select(.metadata.container.tags[]? == \"$tag\") | .id" \
                | head -n 1
            )"

            if [[ -z "$version_id" ]]; then
              echo "No staging package version found for $tag"
              return 0
            fi

            echo "Deleting staging package version $version_id for $tag"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "${versions_path%/versions}/versions/$version_id"
          }

          jq -c '.[]' <<< "$IMAGES" | while read -r image; do
            major="$(jq -r '.major' <<< "$image")"
            delete_staging_tag "ci-$RELEASE_TAG-$major-${{ github.run_id }}-${{ github.run_attempt }}"
          done

  summary:
    name: Publish summary
    needs:
      - plan
      - build-test-stage
      - upgrade-tests
      - promote-images
      - cleanup-staging
    if: always() && needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          IMAGES: ${{ needs.plan.outputs.moving_tags }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          {
            echo "## Image publish"
            echo
            echo "- Project release: $RELEASE_TAG"
            echo "- Dry run: $DRY_RUN"
            echo
            echo "| Track | Immutable source | Moving tags |"
            echo "|---|---|---|"
            jq -r '.[] | "| `\(.major)` | `\(.immutable[0])` | `\(.moving | join("`, `"))` |"' <<< "$IMAGES"
          } >> "$GITHUB_STEP_SUMMARY"
