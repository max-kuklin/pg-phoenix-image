name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump from the latest v* tag
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Compute the release tag without creating it
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Require main branch
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from main; current ref is $GITHUB_REF" >&2
            exit 1
          fi

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -z "$latest" ]]; then
            major=0
            minor=0
            patch=0
          elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Latest tag does not match vMAJOR.MINOR.PATCH: $latest" >&2
            exit 1
          fi

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump: $BUMP" >&2
              exit 1
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          previous="$latest"

          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "Tag already exists: $next" >&2
            exit 1
          fi

          {
            echo "previous_tag=$previous"
            echo "tag=$next"
          } >> "$GITHUB_OUTPUT"

          echo "Previous tag: ${previous:-<none>}"
          echo "Next tag: $next"

      - name: Create release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          notes_args=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${notes_args[@]}"

      - name: Write summary
        run: |
          {
            echo "## Release"
            echo
            echo "- Previous tag: ${{ steps.version.outputs.previous_tag || '<none>' }}"
            echo "- Next tag: ${{ steps.version.outputs.tag }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release images
    needs: release
    if: needs.release.outputs.dry_run != 'true'
    uses: ./.github/workflows/publish-images.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
      track_ref: ${{ needs.release.outputs.tag }}
      tracks: all
      publish_moving_tags: true
      dry_run: false
    permissions:
      contents: read
      packages: write
